<div class="max-w-screen-xl mx-auto px-6 sm:px-12 py-4 md:py-6">
  <h4 class="text-2xl md:text-4xl leading-tight font-normal text-right"><small>$category$</small></h4>
  <!--
    One column per entry: the title, teaser and "Read more" all share the
    container's left edge. They used to sit in differently padded wrappers,
    which is why the link hung 24-48px to the left of the title.
  -->
  $for(news)$
  <div class="py-4 md:py-6">
    <h2 class="text-2xl md:text-4xl leading-tight font-normal">$title$</h2>
    $if(author)$
    <div class="text-xl mt-2">
      $author$
    </div>
    $endif$
    <div class="mt-8 space-y-4"><p>$teaser$</p></div>
    <div class="mt-6">
      $if(link)$
      <a class="arrow-link" href="$link$" target="_blank">&gt;&gt; Read more</a>
      $else$
      <a class="arrow-link" href="$url$">&gt;&gt; Read more</a>
      $endif$
    </div>
  </div>
  $endfor$
</div>
