# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the hakyll branch
  push:
    branches: [ hakyll ]
  pull_request:
    branches: [ hakyll ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Also run weekly to keep the Github cache warm, else the next deploy
  # takes >30mins
  schedule:
    - cron: '0 7 * * 1'  # 8AM CET/11PM PT on Mondays

# Allow github actions to commit to the branch
permissions:
  contents: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    strategy:
      matrix:
        stack: ["3.11.1"]
        ghc: ["9.10.3"]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: haskell-actions/setup@v2
        name: Setup Haskell Stack
        with:
          ghc-version: ${{ matrix.ghc }}
          stack-version: ${{ matrix.stack }}

      - uses: actions/setup-node@v6
        name: Setup NodeJS
        with:
          node-version: 24

      - uses: actions/cache/restore@v4
        id: cache
        name: Cache ~/.stack
        with:
          path: ~/.stack
          key: ${{ runner.os }}-${{ matrix.ghc }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ matrix.ghc }}-

      - name: Build site dependencies
        run: stack build --system-ghc --only-dependencies haskell-foundation:exe:site

      - uses: actions/cache/save@v4
        # We shouldn't ever run into an exact key hit (in theory),
        # but this prevents errors if we do.
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ~/.stack
          key: ${{ runner.os }}-${{ matrix.ghc }}-${{ github.sha }}

      - name: Build site executable
        run: stack build --system-ghc haskell-foundation:exe:site

      # The social cross-post script is a developer tool, not part of the
      # deployed site. Compile it on PRs to catch breakage, but skip it on
      # pushes to hakyll so deploys don't depend on it.
      - name: Build social cross-post script
        if: ${{ github.event_name == 'pull_request' }}
        run: stack build --system-ghc haskell-foundation:exe:social-draft

      - name: Build site
        run:  stack exec --system-ghc site rebuild

      # assets/css/tailwind.built.css is the checked-in Tailwind output, which
      # `site rebuild` above copied into _site — i.e. it is what ships. So this
      # gate is what keeps a stale stylesheet from being deployed: rebuild it
      # from source (the Node/Tailwind toolchain lives in tools/tailwind/, whose
      # npm scripts cd back to the repo root before invoking postcss) and fail
      # if the committed copy differs.
      - name: Check assets/css/tailwind.built.css is in sync with Tailwind output
        run: |
          (cd tools/tailwind && npm ci && npm run build)
          if ! git diff --quiet -- assets/css/tailwind.built.css; then
            echo "::error file=assets/css/tailwind.built.css::The checked-in CSS is out of date. Regenerate it with 'cd tools/tailwind && npm run build' and commit the result."
            git --no-pager diff -- assets/css/tailwind.built.css
            exit 1
          fi

      - name: Deploy
        # Deploy only from non-pull-request changes to hakyll branch
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/hakyll'}}
        run: |
            git config user.name github-actions
            git config user.email github-actions@github.com
            git checkout main
            git pull --rebase
            # Overwrite existing files with new files
            cp -a -v _site/. .
            #  Commit
            git add --all
            git commit --allow-empty -m "[`date '+%F %T %Z'`] New release [ci skip]"
            # Push
            git push origin main:main
